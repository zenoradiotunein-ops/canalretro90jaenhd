<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canal Retro HITS 90 HD</title>

  <!-- Configuración para que el móvil lo instale como App (sin barra de navegador) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Retro 90 TV">
  <meta name="application-name" content="Retro 90 TV">
  <meta name="theme-color" content="#000000">

  <!-- Icono de la aplicación en el móvil usando tv.png -->
  <link rel="icon" type="image/png" href="https://zenoradiotunein-ops.github.io/canalretro90jaenhd/tv.png">
  <link rel="shortcut icon" type="image/png" href="https://zenoradiotunein-ops.github.io/canalretro90jaenhd/tv.png">
  <link rel="apple-touch-icon" href="https://zenoradiotunein-ops.github.io/canalretro90jaenhd/tv.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Carga tu canal directamente a pantalla completa dentro de la App -->
  <iframe src="https://zenoradiotunein-ops.github.io/canalretro90jaenhd/index.html" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
</body>
</html>
